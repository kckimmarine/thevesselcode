# Cloudflare Workers Git Builds (thevesselcode) — static dist/ + minimal router Worker.
# Legacy Pages workflow: no deploy command; use Build output directory dist instead.
name = "thevesselcode"
main = "cloudflare/worker-site-router.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

# Pages-only (wrangler pages deploy); optional if using legacy Pages Git.
pages_build_output_dir = "dist"
