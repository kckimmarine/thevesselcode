name: Daily Google Indexing Push

# Scheduled IMPA store URL notifications to Google Indexing API (200/day).
# Manual: Actions → Daily Google Indexing Push → Run workflow

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-google-indexing
  cancel-in-progress: false

jobs:
  push-indexing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Generate IMPA SEO index
        run: node scripts/generate-impa-seo-index.mjs

      - name: Push up to 200 URLs (Google Indexing API)
        env:
          GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON is not set — skipping API push."
            exit 0
          fi
          npm run push:indexing -- --limit 200 --tolerate-quota

      - name: Commit indexing state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .data/google-indexing-state.json
          if git diff --staged --quiet; then
            echo "No indexing state changes to commit."
            exit 0
          fi
          git commit -m "chore(indexing): update Google Indexing API push state [skip ci]"
          git push origin HEAD:master
