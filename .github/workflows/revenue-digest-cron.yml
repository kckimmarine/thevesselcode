name: Revenue pipeline digest

# Weekly GSC + GA4 → money-actions email (Mon 00:15 UTC ≈ 09:15 KST).
# Runs in GitHub Actions (does not depend on Vercel /api being up).
# Manual: Actions → Revenue pipeline digest → Run workflow

on:
  schedule:
    - cron: '15 0 * * 1'
  workflow_dispatch:

concurrency:
  group: revenue-digest-cron
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run revenue digest (GSC + GA4 → notify)
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REVENUE_DIGEST_TO: ${{ secrets.REVENUE_DIGEST_TO }}
          CONTACT_TO_EMAILS: ${{ secrets.CONTACT_TO_EMAILS }}
          CONTACT_SLACK_WEBHOOK_URL: ${{ secrets.CONTACT_SLACK_WEBHOOK_URL }}
          CONTACT_KAKAO_WORK_WEBHOOK_URL: ${{ secrets.CONTACT_KAKAO_WORK_WEBHOOK_URL }}
        run: node scripts/run-revenue-digest.mjs
